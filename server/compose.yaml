services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: daisy
      POSTGRES_USER: daisy
      POSTGRES_PASSWORD: ${DAISY_DB_PASSWORD:?Set DAISY_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - daisy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daisy -d daisy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  daisy-postgres-data:
