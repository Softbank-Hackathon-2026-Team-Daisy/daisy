spring:
  application:
    name: daisy-server
  datasource:
    url: ${DAISY_DB_URL:jdbc:postgresql://localhost:5432/daisy}
    username: ${DAISY_DB_USER:daisy}
    password: ${DAISY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE

daisy:
  auth:
    secret: ${DAISY_AUTH_SECRET}
    token-ttl: ${DAISY_AUTH_TOKEN_TTL:12h}
    issuer: daisy
  cors:
    allowed-origins: ${DAISY_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  demo:
    owner-username: ${DAISY_DEMO_OWNER_USERNAME:daisy}
    owner-password: ${DAISY_DEMO_OWNER_PASSWORD:}
    viewer-username: ${DAISY_DEMO_VIEWER_USERNAME:judge}
    viewer-password: ${DAISY_DEMO_VIEWER_PASSWORD:}

logging:
  structured:
    format:
      console: logstash
